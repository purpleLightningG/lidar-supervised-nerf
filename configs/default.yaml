# default.yaml — Shared settings for both baseline and depth-supervised training.

data:
  sequence_dir: "C:/Users/Dream Team/Desktop/nerf/2011_09_26/2011_09_26_drive_0005_sync"
  calib_dir:    "C:/Users/Dream Team/Desktop/nerf/2011_09_26"
  depth_cache_dir: "outputs/depth_cache"
  val_stride: 8  # every 8th frame held out for evaluation

model:
  num_pos_freqs: 10
  num_dir_freqs: 4
  hidden_dim: 256
  num_layers: 8
  skip_layer: 4

rendering:
  near: 0.5
  far: 80.0
  num_coarse: 64
  num_fine: 128

training:
  num_iterations: 200000
  rays_per_iter: 1024
  learning_rate: 5.0e-4
  lr_decay: 0.95          # exponential decay factor
  lr_decay_every: 10000   # apply decay every N iterations
  save_every: 25000
